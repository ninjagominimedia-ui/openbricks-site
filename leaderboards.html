<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<meta name="theme-color" content="#0d1017">
<title>Leaderboards — OpenBricks</title>
<meta name="description" content="Every OpenBricks ranking: pack collectors, card completion, catchers, battles, mini-games, the Ninjago Master Exam, the richest players and the strongest clans.">
<link rel="stylesheet" href="assets/style.css?v=20261109b">
</head>
<body>
<div class="wrap" style="padding:40px 24px 80px">
  <h1 class="page-title">Leaderboards</h1>
  <p class="page-sub">Every ranking across all servers: cards, battles, games, the Ninjago Master Exam, coins and clans.</p>
  <div class="tabs" id="tabs"></div>
  <div id="board"><div class="spinner"></div></div>
</div>
<script src="assets/config.js?v=20261110b"></script>
<script src="assets/common.js?v=20261110"></script>
<script>
  renderNav('lb'); renderFooter();
  const winRate = (r) => Math.round((r.wins / Math.max(1, r.wins + r.losses)) * 100);
  const time = (s) => (s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`);
  const GAMES = { episode: 'Episode Guesser', set: 'Set Guesser', minifigure: 'Minifigure Guesser', cmf: 'CMF Guesser', location: 'Location Guesser',
    quiz: 'Quiz', quote: 'Quote Quiz', blacktea: 'Black Tea', greentea: 'Green Tea', tictactoe: 'Tic Tac Toe', blackjack: 'Blackjack', chess: 'Chess', rps: 'Rock Paper Scissors' };
  // main = the number the board is sorted by (big on the podium, bar in the table); cols = extra table columns
  // title(r) = extra badge after the name; label(r) = shown instead of the player name (clans); notYou = rows aren't players
  const BOARDS = {
    collectors: { tab: 'Pack collectors', main: (r) => r.unique_cards, unit: 'unique cards', sub: (r) => `${fmt(r.total)} total · ${fmt(r.specials)} special`,
      cols: [['Total', (r) => fmt(r.total)], ['Specials', (r) => fmt(r.specials)]], intro: () => 'Most different pack cards collected. Special versions break ties.' },
    completion: { tab: 'Completion', main: (r) => r.unique_cards, unit: 'different cards', sub: (r) => `${fmt(r.total)} cards owned`,
      cols: [['Owned', (r) => fmt(r.total)]], intro: () => 'Closest to owning every classic card. Catches, trades and gifts all count; extra copies don\'t.' },
    cards: { tab: 'Card hoard', main: (r) => r.total, unit: 'cards', sub: (r) => `${fmt(r.unique_cards)} different`,
      cols: [['Different', (r) => fmt(r.unique_cards)]], intro: () => 'Most classic cards owned, copies included.' },
    catchers: { tab: 'Catchers', main: (r) => r.n, unit: 'catches', sub: () => 'last 7 days', cols: [], intro: () => 'Most spawn catches in the last 7 days, all servers together.' },
    battle: { tab: 'Battle season', main: (r) => r.rating, unit: 'rating', sub: (r) => `${r.wins}W / ${r.losses}L · ${winRate(r)}%`,
      cols: [['W / L', (r) => `${r.wins} / ${r.losses}`], ['Win %', (r) => `${winRate(r)}%`]], intro: () => `Season ${esc(data.season)} · top 3 win coins, #1 gets the Champion sleeve.` },
    battleAll: { tab: 'Battle all-time', main: (r) => r.wins, unit: 'wins', sub: (r) => `${r.losses}L · best rating ${fmt(r.best)}`,
      cols: [['Losses', (r) => fmt(r.losses)], ['Win %', (r) => `${winRate(r)}%`], ['Best rating', (r) => fmt(r.best)]], intro: () => 'Ranked battle wins over every season.' },
    exam: { tab: 'Master Exam', main: (r) => r.score, unit: 'points', sub: (r) => `${r.correct}/20 right · ${time(r.secs)}`,
      title: (r) => (r.gm ? ' <span class="you gm">Grand Master</span>' : ''),
      cols: [['Right', (r) => `${r.correct}/20`], ['Bonus', (r) => (r.bonus ? 'Solved' : '—')], ['Hints', (r) => `${r.hints}/5`], ['Time', (r) => time(r.secs)]],
      intro: () => 'The Ninjago Master Exam: 20 hard questions, one attempt, no retries. Only a perfect 100 earns Grand Master of Ninjago. Start it in Discord with <code>!ninjagoexam</code>. Ties: faster wins.' },
    games: { tab: 'Mini-games', main: (r) => r.wins, unit: 'wins', sub: () => 'wins', cols: [], intro: () => 'Top 10 for every mini-game. Pick a game:' },
    rich: { tab: 'Richest', main: (r) => r.coins, unit: 'OBCoins', sub: (r) => `${fmt(r.bank)} in the bank`,
      cols: [['Wallet', (r) => fmt(r.wallet)], ['Bank', (r) => fmt(r.bank)]], intro: () => 'Most OBCoins in total: wallet plus bank.' },
    sellers: { tab: 'Top sellers', main: (r) => r.n, unit: 'sales', sub: (r) => `${fmt(r.v)} OBCoins earned`,
      cols: [['Earned', (r) => fmt(r.v)]], intro: () => 'Most cards sold on the secondhand market, all time.' },
    clans: { tab: 'Clans', main: (r) => r.level, unit: 'level', sub: (r) => `${fmt(r.members)} members · ${fmt(r.xp)} XP`, label: (r) => r.name, notYou: true,
      cols: [['Members', (r) => fmt(r.members)], ['XP', (r) => fmt(r.xp)], ['War wins', (r) => fmt(r.wins)], ['Owner', (r) => esc(r.user?.name || 'Unknown')]],
      intro: () => 'Strongest clans by level, then XP. The picture is the clan owner.' },
  };
  let data = null, tab = BOARDS[location.hash.slice(1)] ? location.hash.slice(1) : 'collectors', game = null;
  const me = Session.user?.id;
  $('#tabs').innerHTML = Object.entries(BOARDS).map(([k, b]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${b.tab}</button>`).join('');
  const isMe = (r, b) => !b.notYou && r.userId === me;
  const plain = (r, b) => (b.label ? b.label(r) : r.user?.name) || 'Unknown';
  const name = (r, b) => esc(plain(r, b)) + (b.title ? b.title(r) : '') + (isMe(r, b) ? ' <span class="you">you</span>' : '');
  const podium = (rows, b) => {
    const slot = (r, i) => !r ? '' : `<div class="p ${isMe(r, b) ? 'mine' : ''}" style="--c:${['#e2a53b', '#b9b2a6', '#b8743d'][i]}">
      <div class="rank">${i + 1}</div><img src="${avatarUrl(r.userId, r.user?.avatar, 128)}" alt="">
      <div class="name" title="${esc(plain(r, b))}">${name(r, b)}</div>
      <div class="val">${fmt(b.main(r))}<small>${b.unit}</small></div><div class="sub">${b.sub(r)}</div></div>`;
    return `<div class="podium">${rows.slice(0, 3).map(slot).join('')}</div>`;
  };
  const draw = () => {
    const b = BOARDS[tab];
    let rows = data[tab] || [], pre = `<p class="page-sub">${b.intro()}</p>`;
    if (tab === 'games') {
      const keys = Object.keys(data.games || {}).sort((x, y) => (GAMES[x] || x).localeCompare(GAMES[y] || y));
      if (!keys.includes(game)) game = keys[0];
      pre += keys.length ? `<div class="tabs sub">${keys.map((k) => `<button data-game="${esc(k)}" class="${k === game ? 'on' : ''}">${esc(GAMES[k] || k)}</button>`).join('')}</div>` : '';
      rows = data.games?.[game] || [];
    }
    if (!rows.length) { $('#board').innerHTML = `${pre}<div class="empty">Nobody here yet. Be the first!</div>`; return bindGames(); }
    const top = Math.max(1, b.main(rows[0])), mine = b.notYou ? -1 : rows.findIndex((r) => r.userId === me);
    const rest = rows.slice(3);
    $('#board').innerHTML = `${pre}${podium(rows, b)}
      ${me && !b.notYou ? `<p class="page-sub" style="margin:0 0 14px">${mine >= 0 ? `You're <b>#${mine + 1}</b>${mine > 0 ? ` · ${fmt(b.main(rows[mine - 1]) - b.main(rows[mine]))} behind #${mine}` : ' (top spot)'}` : `You're not in the top ${rows.length} yet.`}</p>` : ''}
      ${rest.length ? `<table class="lb"><thead><tr><th>#</th><th>${b.label ? 'Clan' : 'Player'}</th><th>${b.unit}</th>${b.cols.map(([h]) => `<th class="hide-sm">${h}</th>`).join('')}</tr></thead><tbody>
      ${rest.map((r, i) => `<tr class="${isMe(r, b) ? 'mine' : ''}"><td class="pos">#${i + 4}</td>
        <td><div class="who"><img src="${avatarUrl(r.userId, r.user?.avatar)}" alt="">${name(r, b)}</div></td>
        <td><b>${fmt(b.main(r))}</b><div class="bar"><i style="width:${Math.max(2, (b.main(r) / top) * 100)}%"></i></div></td>
        ${b.cols.map(([, f]) => `<td class="hide-sm">${f(r)}</td>`).join('')}</tr>`).join('')}
      </tbody></table>` : ''}`;
    bindGames();
  };
  const bindGames = () => document.querySelectorAll('[data-game]').forEach((x) => (x.onclick = () => { game = x.dataset.game; draw(); }));
  document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => {
    tab = b.dataset.tab; history.replaceState(null, '', '#' + tab);
    document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b)); if (data) draw();
  }));
  fetch(OB.API + '/api/leaderboards').then((r) => r.json()).then((d) => { data = d; draw(); })
    .catch(() => { $('#board').innerHTML = '<div class="empty">Leaderboards are offline right now.</div>'; });
</script>
</body>
</html>
